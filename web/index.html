<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>push.eval · 人工评测台</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222e; --line:#2a2f3d;
    --txt:#e6e9ef; --muted:#9aa3b2; --dim:#6b7280;
    --accent:#6366f1; --accent2:#8b5cf6;
    --doubao:#f59e0b; --gemini:#22d3ee; --human:#34d399;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24;
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;font-size:14px}
  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 22px}
  .hrow{display:flex;align-items:center;gap:16px;max-width:1320px;margin:0 auto}
  .logo{font-weight:700;font-size:15px;white-space:nowrap}
  .logo span{color:var(--accent2)}
  .tabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px}
  .tab{padding:6px 14px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);transition:.15s;white-space:nowrap}
  .tab.on{background:var(--accent);color:#fff;font-weight:600}
  .prog-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
  .bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);background:#222636}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  main{max-width:1320px;margin:22px auto;padding:0 22px;display:grid;
    grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between}
  .video-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .video-box iframe{width:100%;height:100%;border:0}
  .vtitle{font-size:15px;font-weight:600;margin-top:12px}
  .vmeta{color:var(--muted);font-size:12px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .dim-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .dim-vr{background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)}
  .dim-cf{background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}
  .kv{display:flex;gap:8px;font-size:13px;margin:3px 0}
  .kv b{color:var(--muted);font-weight:500;min-width:70px}
  .copy{background:var(--panel2);border-radius:10px;padding:13px 15px;border:1px solid var(--line)}
  .copy .t{font-weight:600;font-size:15px;margin-bottom:5px}
  .copy .b{color:#cdd3df;font-size:13.5px}

  /* refine choices (big) */
  .ask{font-size:14px;font-weight:600;margin-bottom:13px}
  .ask em{color:var(--accent2);font-style:normal}
  .choices{display:flex;gap:8px}
  .choice{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;
    padding:13px 6px;cursor:pointer;text-align:center;transition:.12s;position:relative}
  .choice:hover{border-color:var(--accent);transform:translateY(-2px)}
  .choice.sel{border-color:var(--human);background:rgba(52,211,153,.12)}
  .choice .n{font-size:23px;font-weight:800;line-height:1}
  .choice .lbl{font-size:11px;color:var(--muted);margin-top:6px}
  .choice .key{position:absolute;top:5px;right:7px;font-size:10px;color:var(--dim)}

  /* audit: compact 13-dim */
  .grp-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2);margin:14px 0 8px;font-weight:600}
  .grp-h:first-child{margin-top:0}
  .drow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .drow:last-child{border:0}
  .dname{flex:1;font-size:13px}
  .dname small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .scale{display:flex;gap:4px}
  .sc-btn{width:30px;height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.12s}
  .sc-btn:hover{border-color:var(--accent);color:var(--txt)}
  .sc-btn.sel{background:var(--human);border-color:var(--human);color:#06281c}
  .sc-na{font-size:11px;color:var(--dim);font-style:italic}
  .toggle{display:flex;gap:4px}
  .tg{padding:5px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;cursor:pointer;transition:.12s}
  .tg.ok.sel{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good)}
  .tg.bad.sel{background:rgba(248,113,113,.18);border-color:var(--bad);color:var(--bad)}

  .note-in{width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;color:var(--txt);font-size:13px;font-family:inherit;resize:vertical;min-height:36px}
  .note-in::placeholder{color:var(--dim)}
  .reveal{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:none}
  .reveal.show{display:block}
  .verdict{font-size:13px;font-weight:600;margin-bottom:10px}
  .scores{display:flex;gap:10px}
  .sc-pill{flex:1;background:var(--panel2);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
  .sc-pill .who{font-size:11px;color:var(--muted);margin-bottom:3px}
  .sc-pill .v{font-size:21px;font-weight:800}
  .sc-pill.match{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
  .sc-pill .tag{font-size:10px;margin-top:2px;color:var(--dim)}
  .c-doubao{color:var(--doubao)} .c-gemini{color:var(--gemini)} .c-human{color:var(--human)}
  .anchor{font-size:12px}
  .anchor .row{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .anchor .row:last-child{border:0}
  .anchor .sc{font-weight:700;min-width:14px;color:var(--accent2)}
  .nav{display:flex;gap:10px;align-items:center;margin-top:14px}
  .nav .spacer{flex:1}
  .hint{color:var(--dim);font-size:11.5px}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;
    align-items:center;justify-content:center;z-index:50;padding:22px}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:26px}
  .sheet h2{font-size:19px;margin-bottom:4px}
  .lead{color:var(--muted);font-size:13px;margin-bottom:18px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center}
  .stat .big{font-size:28px;font-weight:800}
  .stat .cap{font-size:11.5px;color:var(--muted);margin-top:5px}
  .verdict-box{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:13px 15px;font-size:13px;margin:14px 0;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0}
  th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:500;font-size:11.5px}
  .empty{color:var(--dim);text-align:center;padding:50px;font-size:13px;grid-column:1/-1}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">push<span>.eval</span> · 人工评测台</div>
    <div class="tabs">
      <div class="tab" data-mode="refine">refine 裁决</div>
      <div class="tab" data-mode="audit">全量抽检</div>
    </div>
    <div class="prog-wrap"><div class="bar"><i id="barFill"></i></div><div class="count" id="count">—</div></div>
    <button class="btn" id="btnSummary">统计</button>
    <button class="btn" id="btnExport">导出</button>
  </div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="data_refine.js"></script>
<script src="data_audit.js"></script>
<script>
const REFINE = window.REFINE_DATA || [];
const AUDIT  = window.AUDIT_DATA  || [];

// ---- refine anchors (2 dims, full 1-5) ----
const RA = {
  video_relevance:{name:'视频相关性',cls:'dim-vr',ask:'按完整视频，这条文案的<em>视频相关性</em>该打几分？',
    rows:[['5','抓住视频最独特/具体的钩子（非泛泛复述）','独特'],['4','准确覆盖主旨但停留概括层面','泛泛'],
          ['3','只抓次要点或主点抓偏','次要点'],['2','5W1H 部分错（dog说成cat）','部分错'],['1','5W1H 完全错','完全错']]},
  content_fidelity:{name:'内容忠实度',cls:'dim-cf',ask:'按完整视频，这条文案的<em>内容忠实度</em>该打几分？',
    rows:[['5','零夸张，每个断言视频有据','零夸张'],['4','营销式轻微夸大（最高级/拔高）','轻夸大'],
          ['3','混淆视频里两个不同事实','混淆'],['2','编造视频没有的事实','编造'],['1','多处严重编造','严重编造']]}
};
// ---- audit: 9 effect dims (compact 1-5) + 4 safety (binary) ----
const EFFECT=[
  ['readability','可读性','无拼写语法错+清晰+精炼 → 高'],
  ['video_relevance','视频相关性','抓住视频最独特的点 → 高'],
  ['content_fidelity','内容忠实度','零夸张、断言有据 → 高'],
  ['expressiveness','表达力','信息+生动+有钩子 → 高'],
  ['naturalness','自然度','无翻译腔、无套路词 → 高'],
  ['expectation_alignment','预期一致','钩子在视频前段兑现 → 高'],
  ['preference_match','偏好匹配','文案垂类命中用户偏好 → 高（cold-start N/A）'],
  ['tone_fit','语气适配','语气贴合用户生命周期 → 高'],
  ['push_value','打扰价值','值得为这用户打断推送 → 高'],
];
const SAFETY=[
  ['misleading','误导失真','编造视频没有的事实/严重歪曲'],
  ['manipulative','心理操纵','FOMO/紧迫/制造焦虑逼点击'],
  ['harmful','有害内容','暴力/色情/仇恨/歧视'],
  ['privacy','隐私泄露','暴露视频里的个人身份信息'],
];

let mode = localStorage.getItem('pe_mode') || 'refine';
let idx = 0;
const ratings = {
  refine: JSON.parse(localStorage.getItem('pe_refine')||'{}'),
  audit:  JSON.parse(localStorage.getItem('pe_audit') ||'{}'),
};
function data(){ return mode==='refine'?REFINE:AUDIT; }
function saveR(){ localStorage.setItem('pe_refine',JSON.stringify(ratings.refine)); }
function saveA(){ localStorage.setItem('pe_audit', JSON.stringify(ratings.audit)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function refineDone(){ return REFINE.filter(d=>(ratings.refine[d.id]||{}).score).length; }
function auditDone(){ return AUDIT.filter(d=>{const r=ratings.audit[d.id]; return r&&r.effect&&Object.keys(r.effect).length>=8;}).length; }

function videoCol(d, extra){
  return `<div class="col">
    <div class="video-box"><iframe src="https://www.youtube.com/embed/${d.youtube_id}" allowfullscreen
      allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe></div>
    <div><div class="vtitle">${esc(d.video_title)}</div>
      <div class="vmeta"><span class="pill">${d.video_id}</span>${extra}</div></div>
    <div class="card"><h3>目标用户</h3>
      <div class="kv"><b>生命周期</b><span>${esc(d.lifecycle)}</span></div>
      <div class="kv"><b>兴趣偏好</b><span>${esc(d.prefs)}</span></div></div>
    <div class="card"><h3>被评文案</h3>
      <div class="copy"><div class="t">${esc(d.title)}</div><div class="b">${esc(d.body)}</div></div></div>
  </div>`;
}

function render(){
  const D=data();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===mode));
  if(!D.length){ document.getElementById('main').innerHTML='<div class="empty">无数据</div>'; return; }
  if(idx>=D.length) idx=D.length-1;
  const done = mode==='refine'?refineDone():auditDone();
  document.getElementById('count').textContent=`${idx+1} / ${D.length} · 已评 ${done}`;
  document.getElementById('barFill').style.width=(done/D.length*100)+'%';
  mode==='refine'?renderRefine():renderAudit();
}

function renderRefine(){
  const d=REFINE[idx], a=RA[d.dim], r=ratings.refine[d.id]||{};
  document.getElementById('main').innerHTML =
    videoCol(d, `<span class="dim-badge ${a.cls}">● ${a.name}</span>`)
    + `<div class="col">
      <div class="card anchor"><h3>判断标准 · ${a.name}</h3>
        ${a.rows.map(([s,t])=>`<div class="row"><span class="sc">${s}</span><span>${t}</span></div>`).join('')}</div>
      <div class="card"><h3>你的裁决（盲评 · 看完视频再打）</h3>
        <div class="ask">${a.ask}</div>
        <div class="choices">${a.rows.map(([sc,desc,short])=>`
          <div class="choice ${r.score==sc?'sel':''}" data-score="${sc}">
            <div class="key">${sc}</div><div class="n">${sc}</div><div class="lbl">${short}</div></div>`).join('')}</div>
        <textarea class="note-in" id="note" placeholder="备注（可选）…">${esc(r.note||'')}</textarea>
        <div class="reveal ${r.score?'show':''}" id="reveal"><div class="verdict" id="verdict"></div><div class="scores" id="scores"></div></div>
        ${navBar()}
      </div></div>`;
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    const n=+c.dataset.score; ratings.refine[d.id]={...(ratings.refine[d.id]||{}),score:n}; saveR();
    document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',+x.dataset.score===n));
    document.getElementById('reveal').classList.add('show'); revealRefine(d,n);
  });
  bindCommon('refine', d);
  if(r.score) revealRefine(d,r.score);
}
function revealRefine(d,human){
  const md=human===d.doubao,mg=human===d.gemini;
  const who=md&&mg?'两个 judge 都对':md?'Doubao 对（Gemini 偏了）':mg?'Gemini 对（Doubao 偏了）':'你和两个 judge 都不同';
  document.getElementById('verdict').innerHTML=`裁决：<span class="c-human">你判 ${human}</span> → ${who}`;
  document.getElementById('scores').innerHTML=`
    <div class="sc-pill ${md?'match':''}"><div class="who">Doubao 主评</div><div class="v c-doubao">${d.doubao}</div><div class="tag">${md?'✓ 一致':''}</div></div>
    <div class="sc-pill match"><div class="who">你·人工</div><div class="v c-human">${human}</div><div class="tag">ground truth</div></div>
    <div class="sc-pill ${mg?'match':''}"><div class="who">Gemini 副评</div><div class="v c-gemini">${d.gemini}</div><div class="tag">${mg?'✓ 一致':''}</div></div>`;
}

function renderAudit(){
  const d=AUDIT[idx], r=ratings.audit[d.id]||{effect:{},safety:{}};
  const eff=r.effect||{}, saf=r.safety||{};
  document.getElementById('main').innerHTML =
    videoCol(d, `<span class="pill">${esc(d.model)}</span><span class="pill">var ${d.var}</span>`)
    + `<div class="col"><div class="card">
        <h3>人工评分 · 全 13 维 <span style="color:var(--dim);text-transform:none;letter-spacing:0">盲评，独立打分</span></h3>
        <div class="grp-h">安全 4 维（违规 = 是/否）</div>
        ${SAFETY.map(([k,nm,desc])=>`
          <div class="drow"><div class="dname">${nm}<small>${desc}</small></div>
            <div class="toggle" data-saf="${k}">
              <div class="tg ok ${saf[k]===false?'sel':''}" data-v="0">无违规</div>
              <div class="tg bad ${saf[k]===true?'sel':''}" data-v="1">违规</div></div></div>`).join('')}
        <div class="grp-h">效果 9 维（1–5）</div>
        ${EFFECT.map(([k,nm,desc])=>{
          const na = k==='preference_match' && d.is_cold;
          return `<div class="drow"><div class="dname">${nm}<small>${desc}</small></div>
            ${na?'<span class="sc-na">N/A · cold-start</span>'
            :`<div class="scale" data-eff="${k}">${[1,2,3,4,5].map(n=>`<button class="sc-btn ${eff[k]===n?'sel':''}" data-v="${n}">${n}</button>`).join('')}</div>`}</div>`;
        }).join('')}
        <textarea class="note-in" id="note" placeholder="备注（可选）…">${esc(r.note||'')}</textarea>
        ${navBar()}
      </div></div>`;
  document.querySelectorAll('[data-saf]').forEach(g=>g.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{
    const k=g.dataset.saf, v=b.dataset.v==='1';
    ratings.audit[d.id]=ratings.audit[d.id]||{effect:{},safety:{}};
    ratings.audit[d.id].safety[k]=v; saveA();
    g.querySelectorAll('.tg').forEach(x=>x.classList.toggle('sel',(x.dataset.v==='1')===v)); refreshCount();
  }));
  document.querySelectorAll('[data-eff]').forEach(g=>g.querySelectorAll('.sc-btn').forEach(b=>b.onclick=()=>{
    const k=g.dataset.eff, v=+b.dataset.v;
    ratings.audit[d.id]=ratings.audit[d.id]||{effect:{},safety:{}};
    ratings.audit[d.id].effect[k]=v; saveA();
    g.querySelectorAll('.sc-btn').forEach(x=>x.classList.toggle('sel',+x.dataset.v===v)); refreshCount();
  }));
  bindCommon('audit', d);
}

function navBar(){
  return `<div class="nav">
    <button class="btn" id="prev" ${idx==0?'disabled':''}>← 上一条</button><div class="spacer"></div>
    <span class="hint">${mode==='refine'?'<kbd>1</kbd>–<kbd>5</kbd> 打分　':''}<kbd>←</kbd><kbd>→</kbd> 切换</span>
    <button class="btn primary" id="next">${idx==data().length-1?'完成 →':'下一条 →'}</button></div>`;
}
function bindCommon(m, d){
  document.getElementById('note').oninput=e=>{
    const R=ratings[m]; R[d.id]=R[d.id]||(m==='audit'?{effect:{},safety:{}}:{}); R[d.id].note=e.target.value;
    m==='refine'?saveR():saveA();
  };
  document.getElementById('prev').onclick=()=>{ if(idx>0){idx--;render();} };
  document.getElementById('next').onclick=()=>{ if(idx<data().length-1){idx++;render();} else showSummary(); };
}
function refreshCount(){
  const done=mode==='refine'?refineDone():auditDone();
  document.getElementById('count').textContent=`${idx+1} / ${data().length} · 已评 ${done}`;
  document.getElementById('barFill').style.width=(done/data().length*100)+'%';
}

// ---- summary ----
function showSummary(){
  document.getElementById('sheet').innerHTML = mode==='refine'?summaryRefine():summaryAudit();
  document.getElementById('modal').classList.add('show');
}
function summaryRefine(){
  let dW=0,gW=0,neither=0,total=0; const byDim={};
  REFINE.forEach(d=>{const r=ratings.refine[d.id]; if(!r||!r.score)return; total++; const h=r.score;
    const md=h===d.doubao,mg=h===d.gemini; byDim[d.dim]=byDim[d.dim]||{n:0,d:0,g:0};
    const bd=byDim[d.dim]; bd.n++; if(md&&mg){dW++;gW++;bd.d++;bd.g++;}else if(md){dW++;bd.d++;}else if(mg){gW++;bd.g++;}else neither++;});
  if(!total) return `<h2>还没评</h2><div class="lead">打几条再看。</div><button class="btn primary" onclick="closeModal()">继续</button>`;
  const lean=dW>gW?'Doubao（refine 主评）更接近你':gW>dW?'Gemini（旧标准）更接近你':'打平';
  const rec=dW>gW?'→ refine 方向对，<b>建议保留新 anchor</b>。':gW>dW?'→ refine 偏离人工，<b>建议回退该维度</b>。':'→ 样本不足或主观，谨慎用。';
  return `<h2>refine 裁决统计</h2><div class="lead">已评 ${total}/${REFINE.length}。你 vs 两个 judge：</div>
    <div class="stat-grid">
      <div class="stat"><div class="big c-doubao">${dW}</div><div class="cap">Doubao 与你一致</div></div>
      <div class="stat"><div class="big c-gemini">${gW}</div><div class="cap">Gemini 与你一致</div></div>
      <div class="stat"><div class="big">${neither}</div><div class="cap">都不一致</div></div></div>
    <div class="verdict-box"><b>${lean}</b><br>${rec}</div>
    <table><thead><tr><th>维度</th><th>已评</th><th>Doubao中</th><th>Gemini中</th></tr></thead><tbody>
    ${Object.entries(byDim).map(([k,v])=>`<tr><td>${RA[k].name}</td><td>${v.n}</td><td class="c-doubao">${v.d}</td><td class="c-gemini">${v.g}</td></tr>`).join('')}</tbody></table>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary" onclick="exportData()">导出裁决 JSON</button><button class="btn" onclick="closeModal()">继续</button></div>`;
}
function summaryAudit(){
  const done=auditDone();
  if(!done) return `<h2>还没评</h2><div class="lead">完成几条全维度评分再看。</div><button class="btn primary" onclick="closeModal()">继续</button>`;
  // 各 effect 维度人工均分 + safety 违规率
  const eAgg={}, sAgg={}; let n=0;
  AUDIT.forEach(d=>{const r=ratings.audit[d.id]; if(!r||!r.effect||Object.keys(r.effect).length<8)return; n++;
    EFFECT.forEach(([k])=>{ if(r.effect[k]!=null){eAgg[k]=eAgg[k]||{s:0,c:0}; eAgg[k].s+=r.effect[k]; eAgg[k].c++;} });
    SAFETY.forEach(([k])=>{ if(r.safety&&r.safety[k]!=null){sAgg[k]=sAgg[k]||{v:0,c:0}; sAgg[k].v+=r.safety[k]?1:0; sAgg[k].c++;} });});
  return `<h2>全量抽检统计（ground-truth 锚）</h2>
    <div class="lead">已完成 ${done}/${AUDIT.length} 条全维度评分。这批人工分将作为校准主评的金标准。</div>
    <div class="grp-h">效果 9 维 · 人工均分</div>
    <table><thead><tr><th>维度</th><th>均分</th><th>已评</th></tr></thead><tbody>
    ${EFFECT.map(([k,nm])=>{const a=eAgg[k]; return `<tr><td>${nm}</td><td>${a?(a.s/a.c).toFixed(2):'—'}</td><td>${a?a.c:0}</td></tr>`;}).join('')}</tbody></table>
    <div class="grp-h">安全 4 维 · 人工违规率</div>
    <table><thead><tr><th>类别</th><th>违规率</th><th>已评</th></tr></thead><tbody>
    ${SAFETY.map(([k,nm])=>{const a=sAgg[k]; return `<tr><td>${nm}</td><td>${a?(a.v/a.c*100).toFixed(1)+'%':'—'}</td><td>${a?a.c:0}</td></tr>`;}).join('')}</tbody></table>
    <div class="verdict-box">导出后，全量主评跑完即可做 human-vs-judge 校准（系统偏差 / κ）。</div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary" onclick="exportData()">导出抽检 JSON</button><button class="btn" onclick="closeModal()">继续</button></div>`;
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

function exportData(){
  let out, fn;
  if(mode==='refine'){
    out=REFINE.map(d=>({id:d.id,dim:d.dim,video_id:d.video_id,doubao:d.doubao,gemini:d.gemini,
      human:(ratings.refine[d.id]||{}).score||null,note:(ratings.refine[d.id]||{}).note||''}));
    fn='refine_adjudication_human.json';
  }else{
    out=AUDIT.map(d=>{const r=ratings.audit[d.id]||{}; return {id:d.id,model:d.model,var:d.var,video_id:d.video_id,
      effect:r.effect||{},safety:r.safety||{},note:r.note||''};});
    fn='audit_human_review.json';
  }
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=fn; a.click(); URL.revokeObjectURL(u);
}

// keyboard (refine only for 1-5; nav both)
document.addEventListener('keydown',e=>{
  if(document.getElementById('modal').classList.contains('show')) return;
  if(e.target.tagName==='TEXTAREA') return;
  if(mode==='refine' && ['1','2','3','4','5'].includes(e.key)){
    const d=REFINE[idx]; ratings.refine[d.id]={...(ratings.refine[d.id]||{}),score:+e.key}; saveR(); render(); return; }
  if(e.key==='ArrowRight'){ if(idx<data().length-1){idx++;render();}else showSummary(); }
  else if(e.key==='ArrowLeft'){ if(idx>0){idx--;render();} }
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  mode=t.dataset.mode; localStorage.setItem('pe_mode',mode);
  idx=(()=>{ const D=data(); for(let i=0;i<D.length;i++){ const r=ratings[mode][D[i].id];
    const ev = mode==='refine'?(r&&r.score):(r&&r.effect&&Object.keys(r.effect).length>=8);
    if(!ev) return i; } return 0; })();
  render();
});
document.getElementById('btnExport').onclick=exportData;
document.getElementById('btnSummary').onclick=showSummary;
document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };

idx=(()=>{ const D=data(); for(let i=0;i<D.length;i++){ const r=ratings[mode][D[i].id];
  const ev = mode==='refine'?(r&&r.score):(r&&r.effect&&Object.keys(r.effect).length>=8);
  if(!ev) return i; } return 0; })();
render();
</script>
