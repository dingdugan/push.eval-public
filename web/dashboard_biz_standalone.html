<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-written push copy — evaluation results</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --line:#e4e7ec; --ink:#16202c; --mut:#667085; --soft:#f1f4f8;
    --brand:#2f5fd0; --pos:#0a7d52; --neg:#c2410c; --warn:#b45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
       padding:32px 20px 100px}
  .wrap{max-width:980px;margin:0 auto}
  header{margin-bottom:8px}
  h1{font-size:25px;letter-spacing:.2px}
  .lede{color:var(--mut);font-size:15px;margin-top:8px;max-width:760px}
  h2{font-size:19px;margin:44px 0 4px;display:flex;align-items:baseline;gap:10px}
  h3.ev{font-size:15.5px;margin:26px 0 8px;display:flex;align-items:center;gap:9px;color:#1f2d3d}
  h3.ev .tag{font-size:11.5px;font-weight:700;color:#4a6fa5;background:#e8eefb;border:1px solid #d3e0f5;
             border-radius:5px;padding:2px 8px;letter-spacing:.3px;white-space:nowrap}
  .answer.sm{font-size:15px;font-weight:500;margin:6px 0 10px;color:#33435a}
  h2 .num{font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:5px;padding:2px 8px;letter-spacing:.5px}
  .answer{font-size:17px;font-weight:650;margin:10px 0 16px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .foot{color:var(--mut);font-size:13px;line-height:1.7;margin-top:12px}
  /* 自绘提示: 不依赖浏览器原生 title (原生要悬停 1-2s, 且在 iframe/渲染面板里常不显示) */
  .tip{position:relative;border-bottom:1px dashed var(--brand);cursor:help;color:var(--brand)}
  .tip::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(100% + 9px);background:#16202c;color:#fff;font-size:12.5px;line-height:1.65;
    font-weight:400;padding:9px 12px;border-radius:8px;width:max-content;max-width:300px;
    white-space:normal;text-align:left;opacity:0;visibility:hidden;transition:opacity .15s;
    z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .tip::before{content:'';position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(100% + 3px);border:6px solid transparent;border-top-color:#16202c;
    opacity:0;visibility:hidden;transition:opacity .15s;z-index:20}
  .tip:hover::after,.tip:hover::before{opacity:1;visibility:visible}
  /* 图表点: 悬停显示标签, 同样不依赖 SVG <title> */
  svg .dot .lbl{opacity:0;transition:opacity .12s;pointer-events:none}
  svg .dot:hover .lbl{opacity:1}
  svg .dot:hover circle{r:8;stroke:#fff;stroke-width:2}
  b.pos{color:var(--pos)} b.neg{color:var(--neg)}
  /* 地基条 */
  .basis{background:#eef3fb;border:1px solid #d3e0f5;border-radius:12px;padding:18px 22px;margin-top:18px}
  .basis h3{font-size:14px;color:var(--brand);margin-bottom:12px;letter-spacing:.3px}
  .basis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px 26px}
  .basis-grid dt{font-size:13px;font-weight:700;margin-bottom:3px}
  .basis-grid dd{font-size:13px;color:#42536b;line-height:1.65}
  /* 分数对比 */
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 4px}
  .score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:center}
  .score .lab{font-size:13px;color:var(--mut)}
  .score .val{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
  .score .note{font-size:12px;color:var(--mut)}
  .score.hi{border-color:#b9dccb;background:#f4fbf7}
  .score.hi .val{color:var(--pos)}
  /* 文案对比 */
  .cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  .cmp .ctx{font-size:13px;color:var(--mut);margin-bottom:14px}
  .cmp .ctx b{color:var(--ink)}
  .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .push{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
  .push.win{background:#f4fbf7;border-color:#b9dccb}
  .push .who{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--mut);display:flex;justify-content:space-between}
  .push.win .who{color:var(--pos)}
  .push .t{font-weight:650;margin:7px 0 3px;font-size:14px}
  .push .b{font-size:13px;color:#33435a;line-height:1.6}
  /* 推荐 */
  .rec{background:linear-gradient(180deg,#f4fbf7,#fff);border:1.5px solid #9ed0b6;border-radius:12px;padding:22px}
  .rec .big{font-size:27px;font-weight:700;letter-spacing:-.4px;color:var(--pos)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mut);font-weight:600;font-size:12.5px}
  .bar{height:15px;border-radius:3px;display:inline-block;vertical-align:middle}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
  .kill{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px 16px;font-size:13.5px;margin-top:12px}
  details{margin-top:10px;font-size:13.5px}
  summary{cursor:pointer;color:var(--brand);font-weight:600}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
  .chip{font-size:11.5px;border-radius:5px;padding:2px 8px;background:var(--soft)}
  select{font:inherit;font-size:14px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
  dl.why dt{font-weight:650;margin-top:9px;font-size:13px}
  dl.why dd{color:#4a5a72;font-size:13px}
  .sub-h{font-size:14px;font-weight:700;color:var(--mut);letter-spacing:.4px;margin:22px 0 10px}
  .adv{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);
       border-radius:10px;padding:16px 20px;margin-bottom:10px;display:flex;gap:14px}
  .adv .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
           font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .adv b{color:var(--brand)}
  .lim{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:16px 20px;margin-bottom:10px}
  .lim b{color:var(--warn)}
  .langbtn{position:fixed;top:16px;right:18px;z-index:99;font:600 12.5px/1 -apple-system,sans-serif;
    padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--mut);cursor:pointer}
  .langbtn:hover{border-color:#94a3b8;color:var(--ink)}
</style>

};

function renderDrill(){
  const sel = document.getElementById('armSel');
  const keys = Object.keys(D.examples).sort((a,b)=> a===prim?-1: b===prim?1: a.localeCompare(b));
  if(selArm===null || !keys.includes(selArm)) selArm = prim;
  sel.innerHTML = keys.map(k=>`<option value="${k}"${k===selArm?' selected':''}>${esc(armZH(k))}${k===prim?Z('（推荐配置）',' (recommended)'):''}</option>`).join('');
  sel.onchange = () => { selArm = sel.value; drawDrill(); };
  drawDrill();
}
function drawDrill(){
  document.getElementById('drill').innerHTML = (D.examples[selArm]||[]).map(e=>{
    const chips = Object.entries(e.scores).map(([d,v])=>{
      if(typeof v==='boolean') return v?`<span class="chip" style="background:#fee2e2;color:#b91c1c">${DIM(d)} ${Z('违规','violation')}</span>`:'';
      if(v===null) return `<span class="chip">${DIM(d)} ${Z('不适用','n/a')}</span>`;
      const bg = v>=5?'#dcfce7':v>=4?'#eef2f7':'#fef3c7';
      return `<span class="chip" style="background:${bg}">${DIM(d)} <b>${v}</b></span>`;
    }).join('');
    const whys = Object.entries(e.whys).filter(([,w])=>w)
      .map(([d,w])=>`<dt>${DIM(d)}</dt><dd>${esc(w)}</dd>`).join('');
    const persona = (EN() && e.persona_en) ? e.persona_en : e.persona;
    return `<div class="ex">
      <div style="font-size:12.5px;font-weight:700;color:${e.kind==='best'?'var(--pos)':'var(--neg)'}">
        ${e.kind==='best'?Z('打分最高的一条','Highest-scoring example'):Z('打分最低的一条','Lowest-scoring example')}　·　${Z(e.e9+' 分', e.e9+' / 5')}</div>
      <div class="foot" style="margin:4px 0 10px">🎬 ${esc(e.video_title)}<br>${Z('推给：','pushed to: ')}${esc(persona||'')}</div>
      <div class="push"><div class="t">${esc(e.title)}</div><div class="b">${esc(e.body)}</div></div>
      <div class="chips">${chips}</div>
      <details open><summary>${Z('AI 评分员给的理由（13 个维度）',"The AI judge's reasoning (13 dimensions)")}</summary><dl class="why">${whys}</dl></details>
    </div>`;
  }).join('');
}

// ── 局限 ──
function renderLimits(){
  document.getElementById('limits').innerHTML = Z(`
   <div class="sub-h">一、这份结论哪里不可靠</div>
   <div class="lim"><b>打分的是 AI，不是真实用户。</b>这份报告测的是"文案写得好不好"，
     <b>不是</b>"用户会不会点"。点击率、打开率这类真实效果，只有上线做 A/B 才能知道。
     这份评估的价值在于<b>上线前先把明显不行的配置筛掉</b>。</div>
   <div class="lim"><b>人工校准做得不够。</b>原计划人工盲评 330–500 条来校准 AI 评分员的偏差，
     实际只完成了 72 条。影响是：偏差修正值的精度有限。
     但它<b>不影响模型之间的排序</b> —— 修正对所有配置减去的是同一个数。</div>
   <div class="lim"><b>样本量决定了分辨率。</b>416 种组合只能可靠分辨 <b>0.2 分以上</b>的差距。
     模型之间 0.1 分左右的差异，方向可参考，不宜当作确定结论。</div>
   <div class="lim"><b>用户画像是合成的。</b>13 个用户画像由模型生成，用来覆盖不同活跃度和兴趣偏好，
     <b>不是</b>真实用户抽样，也没有使用任何真实用户数据。</div>
   <div class="foot" style="margin-top:16px">
     数据更新于 ${D.generated_at}　·　完整方法论见评估设计文档　·　
     给技术读者的版本（含统计检验细节）：<a href="dashboard.html" style="color:var(--brand)">dashboard.html</a>
   </div>`,
  `
   <div class="sub-h">1 · Where this conclusion is not reliable</div>
   <div class="lim"><b>The scorer is an AI, not a real user.</b> This report measures <i>how well the copy is written</i>,
     <b>not</b> whether users will tap it. Click-through and open rates can only be learned from a live A/B test.
     The value of this evaluation is <b>filtering out the clearly unusable configurations before launch</b>.</div>
   <div class="lim"><b>Human calibration is under-done.</b> The plan called for 330–500 human blind ratings to calibrate the AI judge's bias;
     only 72 were completed. The consequence is limited precision on the bias correction.
     It does <b>not affect the ranking between models</b> — the correction subtracts the same constant from every configuration.</div>
   <div class="lim"><b>Sample size sets the resolution.</b> 416 combinations can only resolve gaps <b>above 0.2 points</b> reliably.
     A ~0.1 difference between models is directional at best, not a firm conclusion.</div>
   <div class="lim"><b>The user profiles are synthetic.</b> The 13 profiles were model-generated to cover different activity levels and interests.
     They are <b>not</b> a sample of real users, and no real user data was used anywhere.</div>
   <div class="foot" style="margin-top:16px">
     Data updated ${D.generated_at}　·　full methodology in the evaluation design doc　·　
     version for technical readers (with significance-test detail): <a href="dashboard.html" style="color:var(--brand)">dashboard.html</a>
   </div>`);
}

// ── 后续建议 ──
function renderAdvice(){
  const kc = A['kimi-k2.6|C'];
  const lenKilled = Object.keys(A).filter(k=>!dc.pool_5_2.includes(k) && A[k].len_ok<TH.len_gate).length;
  document.getElementById('advice').innerHTML = Z(`
   <div class="sub-h">二、接下来建议做什么（按优先级）</div>
   <div class="adv"><div class="no">1</div><div>
     <b>先攻字数达标率这个卡点 —— 它是目前唯一的淘汰原因。</b>
     被筛掉的 ${killedN} 个配置全部栽在这里，没有一个是因为写得不好或不安全。两条路径：
     <br>· <b>快的</b>：给 ${esc(armZH('kimi-k2.6|C'))} 加强字数约束的提示词再测一轮 ——
       它质量 ${kc.e9.toFixed(2)} 分几乎追平第一，成本只有推荐配置的 ${(P.cost/kc.cost).toFixed(0)} 分之一，唯一卡点就是字数达标率 ${(kc.len_ok*100).toFixed(0)}%。
     <br>· <b>彻底的</b>：在系统里加"生成后检查长度、超长自动重写"的兜底。
       ${nAll} 个配置里 ${lenKilled} 个栽在字数，
       说明这是当前模型的<b>普遍弱点而非个别问题</b>；一旦系统有兜底，选型就不必再被这条硬约束绑住，
       可以直接选质量成本更优的配置。
   </div></div>
   <div class="adv"><div class="no">2</div><div>
     <b>推荐配置进小流量 A/B，验真实效果。</b>
     这份评估只能说明"文案写得更好"，说明不了"用户会不会点"。
     它的作用是<b>在上线前把明显不行的配置筛掉</b>，把 ${nAll} 个候选缩到 1 个，
     省下的是 A/B 的流量和时间，不是替代 A/B。
   </div></div>
   <div class="adv"><div class="no">3</div><div>
     <b>补完人工校准，约 2–3 小时。</b>
     104 条抽样和打分工具都已就绪，跑完就能验证 AI 评分员的偏差在新样本上是否稳定 ——
     这是目前这份结论最主要的未闭合项（见上方局限第二条）。
   </div></div>
   <div class="adv"><div class="no">4</div><div>
     <b>若要做分垂类的结论，需要扩样本。</b>
     当前每个内容垂类只有约 4 个视频，"某类内容上哪个模型更好"这种结论只能作方向参考。
     要让它达到可下结论的强度，视频样本量需要从 ${D.totals.n_videos} 扩到 80–150。
   </div></div>`,
  `
   <div class="sub-h">2 · What to do next (in priority order)</div>
   <div class="adv"><div class="no">1</div><div>
     <b>Attack length compliance first — it is currently the only reason anything gets eliminated.</b>
     All ${killedN} filtered-out configurations failed here; not one failed on writing quality or safety. Two routes:
     <br>· <b>The quick one</b>: rerun ${esc(armZH('kimi-k2.6|C'))} with a hardened length constraint in the prompt —
       its quality of ${kc.e9.toFixed(2)} is essentially level with the leader, it costs one ${(P.cost/kc.cost).toFixed(0)}th of the recommended configuration, and length compliance at ${(kc.len_ok*100).toFixed(0)}% is its only blocker.
     <br>· <b>The thorough one</b>: add a system-level fallback that checks length after generation and rewrites anything over the limit.
       ${lenKilled} of ${nAll} configurations failed on length, which makes this a <b>general weakness of current models rather than a quirk of one</b>.
       With that fallback in place, model choice is no longer hostage to the hard limit and you can simply pick the best quality-per-dollar option.
   </div></div>
   <div class="adv"><div class="no">2</div><div>
     <b>Take the recommended configuration into a small-traffic A/B to verify real-world effect.</b>
     This evaluation can show the copy is better written; it cannot show users will tap it.
     Its job is to <b>filter out the clearly unusable options before launch</b>, narrowing ${nAll} candidates to 1.
     What it saves is A/B traffic and time — it does not replace the A/B.
   </div></div>
   <div class="adv"><div class="no">3</div><div>
     <b>Finish the human calibration — about 2–3 hours.</b>
     The 104-item sample and the rating tool are both ready. Completing it would verify whether the AI judge's bias holds steady on a fresh sample —
     the main open gap in this conclusion (see limitation 2 above).
   </div></div>
   <div class="adv"><div class="no">4</div><div>
     <b>Per-vertical conclusions would need a larger sample.</b>
     With only about 4 videos per content vertical, a claim like "model X is better for this kind of content" is directional at best.
     To make it conclusive, the video sample would need to grow from ${D.totals.n_videos} to 80–150.
   </div></div>`);
}

function renderAll(){
  renderHeads(); renderLede(); renderConclusion1(); renderProof1(); renderCopyCmp();
  renderConclusion2(); renderModelCmp(); renderFunnelCost(); renderModality();
  renderDrill(); renderLimits(); renderAdvice();
}
document.getElementById('langBtn').onclick = () => {
  LANG = EN() ? 'zh' : 'en';
  try{ localStorage.setItem('pe_lang', LANG); }catch(_){}
  renderAll();
};
renderAll();
</script>
